[package]
name = "server"
description = "vmdesk server: vkms framebuffer capture, OpenH264 encoding, WebRTC transport and uinput injection (Linux only)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
proto = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
toml = "1"
libc = "0.2"

# capture
drm = "0.15"
drm-ffi = "0.9"
memmap2 = "0.9"
rayon = "1"
png = "0.18"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# encoding (OpenH264 built from the bundled source, no FFmpeg on the server)
openh264 = "0.9"
openh264-sys2 = "0.9"

# transport + signalling
tokio = { workspace = true, features = ["signal"] }
webrtc = { workspace = true }
rtc = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
axum = "0.8"
reqwest = { workspace = true }
