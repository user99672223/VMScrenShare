[workspace]
resolver = "2"
members = ["proto", "server", "client", "e2e"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/user99672223/VMScrenShare"

[workspace.dependencies]
proto = { path = "proto" }
server = { path = "server" }
client = { path = "client" }

anyhow = "1"
thiserror = "2"
bytes = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-log = "0.2"
log = "0.4"
webrtc = "0.21"
rtc = "0.21"
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
strip = true

# OpenH264 is compiled from C/C++ by the openh264-sys2 build script at the profile's opt-level.
# Keep it optimised in debug builds too: the encoder tests and the e2e loopback test push
# hundreds of 720p/1080p frames through it.
[profile.dev.package.openh264-sys2]
opt-level = 3
